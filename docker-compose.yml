services:
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: grant_application
      MYSQL_USER: grant_app
      MYSQL_PASSWORD: local_password
      MYSQL_ROOT_PASSWORD: local_root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    ports:
      - "8000:80"
    volumes:
      - type: bind
        source: ./.env
        target: /var/www/html/.env
        read_only: true
        bind:
          create_host_path: false
      - backend-storage:/var/www/html/storage
    environment:
      APP_NAME: Grant Application API
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      LOG_CHANNEL: stderr
      LOG_LEVEL: debug
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: grant_application
      DB_USERNAME: grant_app
      DB_PASSWORD: local_password
      FILESYSTEM_DISK: local
      MAIL_MAILER: smtp
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: no-reply@example.com
    depends_on:
      mailhog:
        condition: service_started
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  backend-storage:
